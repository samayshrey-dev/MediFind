<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <rect width="1200" height="630" fill="#0B132B"/>
  <rect width="1200" height="630" fill="url(#bg-gradient)" opacity="0.9"/>
  
  <!-- Subtle Grid Accent -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200"/>
    <path d="M100 0V630M200 0V630M300 0V630M400 0V630M500 0V630M600 0V630M700 0V630M800 0V630M900 0V630M1000 0V630M1100 0V630"/>
  </g>

  <!-- Glowing background orbs -->
  <circle cx="1000" cy="180" r="280" fill="#10B981" opacity="0.22" filter="blur(90px)"/>
  <circle cx="250" cy="500" r="220" fill="#0EA5E9" opacity="0.18" filter="blur(80px)"/>

  <!-- Brand Badge -->
  <g transform="translate(100, 80)">
    <rect width="200" height="48" rx="24" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    <circle cx="28" cy="24" r="6" fill="#10B981"/>
    <text x="46" y="29" fill="#10B981" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">REAL-TIME HEALTHCARE</text>
  </g>

  <!-- Main Brand Title -->
  <g transform="translate(100, 200)">
    <text x="0" y="0" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
      Find Medicines Instantly.
    </text>
    <text x="0" y="70" fill="#10B981" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
      Locate Live Stock Nearby.
    </text>
  </g>

  <!-- Subtitle -->
  <text x="100" y="360" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="400">
    Verified real-time pharmacy inventory, price comparison, GPS navigation,
  </text>
  <text x="100" y="396" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="400">
    and guaranteed 15-minute medicine reservation.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 470)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="240" height="54" rx="27" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)"/>
      <circle cx="30" cy="27" r="14" fill="#10B981"/>
      <path d="M26 27L29 30L35 24" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="33" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600">30s Stock Sync SLA</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(260, 0)">
      <rect width="260" height="54" rx="27" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)"/>
      <circle cx="30" cy="27" r="14" fill="#0EA5E9"/>
      <path d="M25 27H35M30 22V32" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <text x="56" y="33" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600">GPS Route Navigation</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(540, 0)">
      <rect width="260" height="54" rx="27" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)"/>
      <circle cx="30" cy="27" r="14" fill="#F59E0B"/>
      <path d="M30 20L32.5 25L38 25.8L34 29.7L35 35.2L30 32.5L25 35.2L26 29.7L22 25.8L27.5 25L30 20Z" fill="#FFFFFF"/>
      <text x="56" y="33" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600">4.9/5 Patient Rating</text>
    </g>
  </g>

  <!-- Logo at bottom right -->
  <g transform="translate(960, 480)">
    <rect width="140" height="46" rx="12" fill="#10B981"/>
    <text x="24" y="30" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800">Medi<tspan fill="#064E3B">AI</tspan></text>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B132B"/>
      <stop offset="0.5" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#064E3B"/>
    </linearGradient>
  </defs>
</svg>

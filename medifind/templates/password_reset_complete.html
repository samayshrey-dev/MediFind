{% extends "base.html" %}
{% load static %}

{% block title %}
Password Changed | MedFinder
{% endblock %}

{% block content %}
<section class="py-5 d-flex align-items-center" style="background: var(--surface-secondary); min-height: 85vh;">
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        
        <div class="card border rounded-4 p-4 p-md-5 shadow-sm bg-white text-center">
          <div class="mb-3 d-inline-flex justify-content-center">
            <div class="d-flex align-items-center justify-content-center rounded-circle bg-success-subtle text-success" style="width: 64px; height: 64px; font-size: 1.8rem;">
              <i class="fa-solid fa-circle-check"></i>
            </div>
          </div>

          <h4 class="fw-bold text-dark mb-2">Password reset successful!</h4>
          <p class="text-muted small mb-4">
            Your password has been successfully updated. You may now log in with your new credentials.
          </p>

          <a href="{% url 'login' %}" class="btn btn-primary w-100 rounded-pill py-2.5 fw-semibold shadow-sm">
            <i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Log In to MedFinder
          </a>
        </div>

      </div>
    </div>
  </div>
</section>
{% endblock %}

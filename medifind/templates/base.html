{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}MediFind - Real-time Pharmacy & Medicine Locator{% endblock %}</title>

<!-- Modern Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Bootstrap 5 & FontAwesome -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<!-- Custom Application Styles -->
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'css/navbar.css' %}">
<link rel="stylesheet" href="{% static 'css/hero.css' %}">
<link rel="stylesheet" href="{% static 'css/stats.css' %}">
<link rel="stylesheet" href="{% static 'css/cards.css' %}">
<link rel="stylesheet" href="{% static 'css/footer.css' %}">
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
<link rel="stylesheet" href="{% static 'css/search.css' %}">

</head>

<body>

{% include 'navbar.html' %}

<div class="container" style="max-width: 850px; position: relative; z-index: 100; margin-top: 95px; margin-bottom: -70px;">

{% if messages %}

  {% for message in messages %}

  <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'primary' }}{% endif %} alert-dismissible fade show rounded-4 shadow-sm border-0 d-flex align-items-center mb-3" role="alert">

    <i class="fa-solid {% if message.tags == 'error' %}fa-circle-exclamation text-danger{% else %}fa-circle-check text-success{% endif %} fs-4 me-3"></i>

    <div class="fw-semibold text-dark me-auto">{{ message }}</div>

    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>

  </div>

  {% endfor %}

{% endif %}

</div>

{% block content %}

{% endblock %}

{% include 'footer.html' %}

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="{% static 'js/main.js' %}"></script>
<script src="{% static 'js/map.js' %}"></script>

<script>
window.addEventListener("scroll", function() {
    const navbar = document.querySelector(".navbar");
    if (navbar) {
        if (window.scrollY > 30) {
            navbar.classList.add("scrolled");
        } else {
            navbar.classList.remove("scrolled");
        }
    }
});
</script>

</body>

</html>
